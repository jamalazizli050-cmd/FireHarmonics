[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "firelens"
version = "0.1.0"
description = "NASA FIRMS MODIS/VIIRS hotspot pipeline for harmonisation research (NASA Space Apps 2026)"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "python-dotenv>=1.0",
    "pandas>=2.1",
    "pyarrow>=14",
    "numpy>=1.26",
    "scipy>=1.11",
    # Needed to load and run the shipped model (data/models/global); pinned to its serialization versions.
    "scikit-learn==1.9.1",
    "xgboost==3.4.1",
    "joblib>=1.3",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
notebook = ["nbformat>=5.9", "nbclient>=0.10", "ipykernel>=6.29"]
dev = ["pytest>=8"]

[project.scripts]
firelens = "firelens.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
